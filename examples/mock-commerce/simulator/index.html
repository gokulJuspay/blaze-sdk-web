<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>Breeze · mock journey</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/sdk/styles/theme.css" />
    <link rel="stylesheet" href="/sdk/styles/shop.css" />
    <script type="module" src="/sdk/app.js"></script>
  </head>
  <body>
    <header class="app-bar">
      <button type="button" class="icon-button" id="back" aria-label="Back" hidden>
        <img class="icon-small" src="/sdk/assets/chevron-left.svg" alt="" />
      </button>
      <img class="logo" src="/sdk/assets/logo.svg" alt="Breeze" />
      <div class="app-bar-actions">
        <button
          type="button"
          class="mock-pill"
          id="tools-toggle"
          aria-controls="tools"
          aria-expanded="false"
        >
          Mock
        </button>
        <span class="cart-icon" aria-label="Cart">
          <img class="icon-small" src="/sdk/assets/icon-cart.svg" alt="" />
          <span class="badge" id="cart-badge" hidden></span>
        </span>
        <button type="button" class="icon-button bordered" id="close" aria-label="Close">
          <img class="icon-small" src="/sdk/assets/icon-close.svg" alt="" />
        </button>
      </div>
    </header>

    <section class="tools" id="tools" hidden>
      <p class="tools-title">Mock tools · not part of the real page</p>
      <div class="tools-actions">
        <button type="button" class="tool-button danger" id="tool-fail">
          Fail (processResult failed)
        </button>
        <button type="button" class="tool-button" id="tool-expire">
          Expire session (refreshSession)
        </button>
      </div>
      <details class="tools-log">
        <summary>Bridge log</summary>
        <pre id="log"></pre>
      </details>
    </section>

    <p class="notice" id="notice" role="status" hidden></p>

    <main class="screen" id="screen"></main>
  </body>
</html>
